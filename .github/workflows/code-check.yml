name: CodeMind code check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JSON config
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('JSON OK')"

      - name: Check JavaScript syntax
        run: |
          set -e
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Check embedded JavaScript in index.html
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';

          const html = fs.readFileSync('public/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map((match) => match[1])
            .filter((code) => code.trim());

          if (!scripts.length) throw new Error('No inline scripts found in index.html');

          scripts.forEach((code, index) => {
            try {
              new vm.Script(code, { filename: `public/index.html:inline-script-${index + 1}.js` });
            } catch (error) {
              console.error(error);
              process.exit(1);
            }
          });

          const doctypeCount = (html.match(/<!DOCTYPE html>/g) || []).length;
          const htmlCount = (html.match(/<html\b/g) || []).length;
          const closeCount = (html.match(/<\/html>/g) || []).length;

          if (doctypeCount !== 1 || htmlCount !== 1 || closeCount !== 1) {
            throw new Error(`Invalid HTML document counts: doctype=${doctypeCount}, html=${htmlCount}, close=${closeCount}`);
          }

          console.log(`index.html OK: ${scripts.length} inline script blocks compiled`);
          NODE
