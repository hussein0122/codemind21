<script>

/* =========================================================
   CODEMIND CONVERSATION MEMORY
========================================================= */

const MEMORY_KEY =
  'codemind_conversation_history_v1';

const MAX_HISTORY_MESSAGES = 30;
const MAX_HISTORY_CHARS = 24000;


/* =========================================================
   ELEMENTS
========================================================= */

const ta =
  document.getElementById('ta');

const sendBtn =
  document.getElementById('sendBtn');

const micBtn =
  document.getElementById('micBtn');

const messagesContainer =
  document.getElementById('messagesContainer');

const heroSection =
  document.getElementById('heroSection');

const statusBanner =
  document.getElementById('statusBanner');

const chatScroll =
  document.getElementById('chatScroll');

const modeSelect =
  document.getElementById('modeSelect');

const modeLabel =
  document.getElementById('modeLabel');


/* =========================================================
   CONVERSATION HISTORY
========================================================= */

let conversationHistory = [];


/* =========================================================
   LOAD MEMORY
========================================================= */

function loadConversationHistory() {

  try {

    const saved =
      localStorage.getItem(
        MEMORY_KEY
      );

    if (!saved) {
      conversationHistory = [];
      return;
    }

    const parsed =
      JSON.parse(saved);

    if (!Array.isArray(parsed)) {

      conversationHistory = [];

      return;
    }

    conversationHistory =
      parsed
        .filter(function(message) {

          return (
            message &&
            (
              message.role === 'user' ||
              message.role === 'assistant'
            ) &&
            typeof message.content === 'string' &&
            message.content.trim()
          );

        })
        .slice(-MAX_HISTORY_MESSAGES);

  } catch (error) {

    console.error(
      'Memory load error:',
      error
    );

    conversationHistory = [];

  }

}


/* =========================================================
   SAVE MEMORY
========================================================= */

function saveConversationHistory() {

  try {

    localStorage.setItem(
      MEMORY_KEY,
      JSON.stringify(
        conversationHistory.slice(
          -MAX_HISTORY_MESSAGES
        )
      )
    );

  } catch (error) {

    console.error(
      'Memory save error:',
      error
    );

  }

}


/* =========================================================
   CLEAR MEMORY
========================================================= */

function clearConversationHistory() {

  conversationHistory = [];

  try {

    localStorage.removeItem(
      MEMORY_KEY
    );

  } catch (error) {

    console.error(
      'Memory clear error:',
      error
    );

  }

}


/* =========================================================
   GET CONTEXT FOR AI
========================================================= */

function getContextHistory() {

  const result = [];

  let totalChars = 0;

  /*
    نأخذ من آخر المحادثة للأقدم
    حتى 30 رسالة وبحد أقصى 24000 حرف.
  */

  for (
    let i = conversationHistory.length - 1;
    i >= 0 && result.length < MAX_HISTORY_MESSAGES;
    i--
  ) {

    const message =
      conversationHistory[i];

    if (
      !message ||
      typeof message.content !== 'string'
    ) {
      continue;
    }

    const content =
      message.content.trim();

    if (!content) {
      continue;
    }

    if (
      totalChars + content.length >
        MAX_HISTORY_CHARS &&
      result.length >= 4
    ) {

      break;

    }

    result.push({

      role:
        message.role,

      content:
        content.slice(0,12000)

    });

    totalChars +=
      content.length;

  }

  /*
    نرجع الترتيب الطبيعي
  */

  return result.reverse();

}


/* =========================================================
   RENDER SAVED CONVERSATION
========================================================= */

function renderSavedConversation() {

  messagesContainer.innerHTML = '';

  if (
    !conversationHistory.length
  ) {

    heroSection.style.display = '';

    return;

  }

  heroSection.style.display = 'none';

  conversationHistory.forEach(
    function(message) {

      if (
        message.role === 'user'
      ) {

        addUserMessage(
          message.content
        );

      }

      if (
        message.role === 'assistant'
      ) {

        addAiMessage(
          message.content
        );

      }

    }
  );

  scrollToBottom();

}


/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar(){

  document
    .getElementById('sidebar')
    .classList
    .toggle('open');

  document
    .getElementById('overlay')
    .classList
    .toggle('show');

}


/* =========================================================
   TEXTAREA
========================================================= */

function resizeTextarea(){

  ta.style.height = 'auto';

  ta.style.height =
    Math.min(
      ta.scrollHeight,
      150
    ) + 'px';

}

ta.addEventListener(
  'input',
  resizeTextarea
);


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text){

  return String(text || '').replace(
    /[&<>"']/g,
    function(match){

      const map = {

        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'

      };

      return map[match];

    }
  );

}


/* =========================================================
   CODE HIGHLIGHT
========================================================= */

function syntaxHighlight(code){

  return escapeHtml(code)

    .replace(
      /(".*?"|'.*?'|`.*?`)/g,
      '<span class="tk-str">$1</span>'
    )

    .replace(
      /\b(function|const|let|var|return|if|else|for|while|class|import|export|from|async|await)\b/g,
      '<span class="tk-kw">$1</span>'
    )

    .replace(
      /(\/\/.*)/g,
      '<span class="tk-com">$1</span>'
    )

    .replace(
      /\b(\d+)\b/g,
      '<span class="tk-num">$1</span>'
    );

}


/* =========================================================
   MARKDOWN
========================================================= */

function parseMarkdown(text){

  let html =
    escapeHtml(text);

  html =
    html.replace(
      /```([\w+-]+)?\n?([\s\S]*?)```/g,
      function(match,lang,code){

        const cleanCode =
          code.replace(
            /^\n|\n$/g,
            ''
          );

        const encoded =
          encodeURIComponent(
            cleanCode
          );

        return `

          <div class="code-block">

            <div class="code-head">

              <span class="code-lang">
                ${lang || 'code'}
              </span>

              <div class="code-actions">

                <button
                  type="button"
                  onclick="copyText(this,'${encoded}')">

                  📋 نسخ الكود

                </button>

              </div>

            </div>

            <div class="code-body">
              ${syntaxHighlight(cleanCode)}
            </div>

          </div>

        `;

      }
    );

  html =
    html.replace(
      /`([^`]+)`/g,
      '<span class="inline-code">$1</span>'
    );

  html =
    html.replace(
      /\*\*([^*]+)\*\*/g,
      '<strong>$1</strong>'
    );

  html =
    html.replace(
      /\n/g,
      '<br>'
    );

  return html;

}


/* =========================================================
   COPY
========================================================= */

async function copyText(btn,encoded){

  try{

    const text =
      decodeURIComponent(encoded);

    await navigator.clipboard.writeText(
      text
    );

    const old =
      btn.innerHTML;

    btn.innerHTML =
      '✅ تم النسخ';

    setTimeout(
      () => btn.innerHTML = old,
      1800
    );

  }catch(error){

    statusBanner.textContent =
      '⚠️ لم يتمكن المتصفح من نسخ النص.';

  }

}


/* =========================================================
   TEXT TO SPEECH
========================================================= */

let activeSpeech = null;

function speakText(btn,encoded){

  if(
    !('speechSynthesis' in window)
  ){

    statusBanner.textContent =
      '⚠️ المتصفح لا يدعم قراءة النصوص صوتيًا.';

    return;

  }

  window.speechSynthesis.cancel();

  if(activeSpeech === btn){

    activeSpeech = null;

    return;

  }

  const text =
    decodeURIComponent(encoded);

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang =
    /[\u0600-\u06FF]/.test(text)
      ? 'ar-SA'
      : 'en-US';

  utterance.rate =
    0.95;

  utterance.onend =
    function(){

      if(
        activeSpeech === btn
      ){

        activeSpeech = null;

        btn.textContent =
          '🔊 استماع';

      }

    };

  activeSpeech = btn;

  btn.textContent =
    '⏹ إيقاف';

  window.speechSynthesis.speak(
    utterance
  );

}


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let recognition = null;
let isListening = false;
let speechPrefix = '';

if(SpeechRecognition){

  recognition =
    new SpeechRecognition();

  recognition.lang =
    'ar-SA';

  recognition.continuous =
    false;

  recognition.interimResults =
    true;

  recognition.onstart =
    function(){

      isListening = true;

      speechPrefix =
        ta.value.trim()
          ? ta.value.trim() + ' '
          : '';

      micBtn.classList.add(
        'active'
      );

      micBtn.textContent =
        '⏹';

    };

  recognition.onresult =
    function(event){

      const transcript =
        Array.from(
          event.results
        )
        .map(
          result =>
            result[0].transcript
        )
        .join('');

      ta.value =
        speechPrefix +
        transcript;

      resizeTextarea();

    };

  recognition.onerror =
    function(event){

      if(
        event.error !== 'aborted'
      ){

        statusBanner.textContent =
          '⚠️ تعذر تشغيل الميكروفون: ' +
          event.error;

      }

    };

  recognition.onend =
    function(){

      isListening = false;

      micBtn.classList.remove(
        'active'
      );

      micBtn.textContent =
        '🎙️';

    };

  micBtn.addEventListener(
    'click',
    function(){

      if(isListening){

        recognition.stop();

      }else{

        try{

          recognition.start();

        }catch(error){

          console.log(error);

        }

      }

    }
  );

}else{

  micBtn.disabled = true;

  micBtn.title =
    'التعرف الصوتي غير مدعوم في هذا المتصفح';

}


/* =========================================================
   AI MODES
========================================================= */

const MODES = {

  fast:'⚡ سريع',

  reason:'🧠 تفكير عميق',

  code:'💻 خبير برمجة',

  net:'🌐 خبير شبكات',

  sec:'🔐 خبير أمن سيبراني'

};

let currentMode =
  'code';

modeSelect.addEventListener(
  'click',
  function(){

    const keys =
      Object.keys(MODES);

    const index =
      keys.indexOf(
        currentMode
      );

    currentMode =
      keys[
        (index + 1) % keys.length
      ];

    modeLabel.textContent =
      MODES[currentMode];

  }
);


/* =========================================================
   ADD USER MESSAGE
========================================================= */

function addUserMessage(text){

  const message =
    document.createElement('div');

  message.className =
    'msg user';

  message.innerHTML = `

    <div class="avatar user">
      أ
    </div>

    <div class="bubble">
      ${escapeHtml(text)}
    </div>

  `;

  messagesContainer.appendChild(
    message
  );

}


/* =========================================================
   ADD AI MESSAGE
========================================================= */

function addAiMessage(text){

  const message =
    document.createElement('div');

  message.className =
    'msg ai';

  const encoded =
    encodeURIComponent(text);

  message.innerHTML = `

    <div class="avatar ai">

      <img
        src="/logo.png"
        alt="CodeMind AI">

    </div>

    <div class="bubble">

      <div class="ai-text">
        ${parseMarkdown(text)}
      </div>

      <div class="msg-actions">

        <button
          type="button"
          onclick="speakText(this,'${encoded}')">

          🔊 استماع

        </button>

        <button
          type="button"
          onclick="copyText(this,'${encoded}')">

          📋 نسخ الرد

        </button>

      </div>

    </div>

  `;

  messagesContainer.appendChild(
    message
  );

}


/* =========================================================
   ADD AI LOADING
========================================================= */

function addAiLoading(){

  const message =
    document.createElement('div');

  message.className =
    'msg ai';

  message.id =
    'loadingMessage';

  message.innerHTML = `

    <div class="avatar ai">

      <img
        src="/logo.png"
        alt="CodeMind AI">

    </div>

    <div class="bubble">

      <div
        class="ai-text"
        id="loadingText">

        جاري التفكير...

      </div>

    </div>

  `;

  messagesContainer.appendChild(
    message
  );

  scrollToBottom();

}


/* =========================================================
   SHOW AI RESPONSE
========================================================= */

function showAiResponse(text){

  const loading =
    document.getElementById(
      'loadingMessage'
    );

  if(!loading) return;

  const encoded =
    encodeURIComponent(text);

  loading.id = '';

  loading.innerHTML = `

    <div class="avatar ai">

      <img
        src="/logo.png"
        alt="CodeMind AI">

    </div>

    <div class="bubble">

      <div class="ai-text">

        ${parseMarkdown(text)}

      </div>

      <div class="msg-actions">

        <button
          type="button"
          onclick="speakText(this,'${encoded}')">

          🔊 استماع

        </button>

        <button
          type="button"
          onclick="copyText(this,'${encoded}')">

          📋 نسخ الرد

        </button>

      </div>

    </div>

  `;

  scrollToBottom();

}


/* =========================================================
   SHOW ERROR
========================================================= */

function showAiError(message){

  const loading =
    document.getElementById(
      'loadingMessage'
    );

  if(loading){

    loading.innerHTML = `

      <div class="avatar ai">

        <img
          src="/logo.png"
          alt="CodeMind AI">

      </div>

      <div class="bubble">

        <div class="ai-text">

          ⚠️ ${escapeHtml(message)}

        </div>

      </div>

    `;

    loading.id = '';

  }

}


/* =========================================================
   SCROLL
========================================================= */

function scrollToBottom(){

  setTimeout(
    function(){

      chatScroll.scrollTop =
        chatScroll.scrollHeight;

    },
    20
  );

}


/* =========================================================
   SEND MESSAGE
========================================================= */

let generating = false;

async function sendMessage(){

  const text =
    ta.value.trim();

  if(!text){

    ta.focus();

    return;

  }

  if(generating){

    return;

  }

  heroSection.style.display =
    'none';

  statusBanner.textContent =
    '';

  /*
    مهم جدًا:

    ناخد الـhistory قبل إضافة
    الرسالة الجديدة.

    كده الـBackend هيضيف
    الرسالة الجديدة مرة واحدة فقط.
  */

  const contextHistory =
    getContextHistory();

  /*
    عرض رسالة المستخدم
  */

  addUserMessage(text);

  /*
    إضافة رسالة المستخدم للذاكرة
  */

  conversationHistory.push({

    role:'user',

    content:text

  });

  saveConversationHistory();

  /*
    Loading
  */

  addAiLoading();

  ta.value = '';

  resizeTextarea();

  generating = true;

  sendBtn.disabled = true;

  sendBtn.textContent = '■';

  try{

    const response =
      await fetch(
        '/api/chat',
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({

            message:text,

            mode:currentMode,

            history:contextHistory

          })

        }
      );

    const data =
      await response
        .json()
        .catch(
          () => ({})
        );

    if(!response.ok){

      const errorMessage =
        data.message ||
        'حدث خطأ أثناء الاتصال بالذكاء الاصطناعي.';

      statusBanner.textContent =
        '⚠️ ' + errorMessage;

      /*
        لو حصل خطأ نحذف
        رسالة المستخدم من الذاكرة
        حتى لا نحفظ رسالة بدون رد.
      */

      conversationHistory =
        conversationHistory.filter(
          function(item,index){

            return !(
              index ===
              conversationHistory.length - 1 &&
              item.role === 'user' &&
              item.content === text
            );

          }
        );

      saveConversationHistory();

      showAiError(
        errorMessage
      );

      return;

    }

    const reply =
      typeof data.reply === 'string'
        ? data.reply.trim()
        : '';

    if(!reply){

      const errorMessage =
        'وصل رد فارغ من خدمة الذكاء الاصطناعي.';

      statusBanner.textContent =
        '⚠️ ' + errorMessage;

      conversationHistory =
        conversationHistory.filter(
          function(item,index){

            return !(
              index ===
              conversationHistory.length - 1 &&
              item.role === 'user' &&
              item.content === text
            );

          }
        );

      saveConversationHistory();

      showAiError(
        errorMessage
      );

      return;

    }

    /*
      عرض الرد
    */

    showAiResponse(
      reply
    );

    /*
      حفظ رد الـAI
    */

    conversationHistory.push({

      role:'assistant',

      content:reply

    });

    /*
      الاحتفاظ بآخر 30 رسالة فقط
    */

    conversationHistory =
      conversationHistory.slice(
        -MAX_HISTORY_MESSAGES
      );

    saveConversationHistory();

  }catch(error){

    console.error(
      'CodeMind API Error:',
      error
    );

    const errorMessage =
      'تعذر الاتصال بالسيرفر. تأكد أن Backend يعمل على Vercel.';

    statusBanner.textContent =
      '⚠️ ' + errorMessage;

    /*
      حذف رسالة المستخدم
      إذا لم يصل الرد للسيرفر.
    */

    conversationHistory =
      conversationHistory.filter(
        function(item,index){

          return !(
            index ===
            conversationHistory.length - 1 &&
            item.role === 'user' &&
            item.content === text
          );

        }
      );

    saveConversationHistory();

    showAiError(
      errorMessage
    );

  }finally{

    generating = false;

    sendBtn.disabled =
      false;

    sendBtn.textContent =
      '➤';

    ta.focus();

  }

}


/* =========================================================
   SEND BUTTON
========================================================= */

sendBtn.addEventListener(
  'click',
  sendMessage
);


/* =========================================================
   ENTER
========================================================= */

ta.addEventListener(
  'keydown',
  function(event){

    if(
      event.key === 'Enter' &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   NEW CHAT
========================================================= */

document
  .getElementById('newChatBtn')
  .addEventListener(
    'click',
    function(){

      /*
        مسح المحادثة من الواجهة
      */

      messagesContainer.innerHTML = '';

      /*
        مسح الـMemory
      */

      clearConversationHistory();

      /*
        إظهار Hero
      */

      heroSection.style.display = '';

      /*
        تنظيف الحالة
      */

      statusBanner.textContent = '';

      ta.value = '';

      resizeTextarea();

      ta.focus();

      if(
        window.innerWidth <= 860
      ){

        toggleSidebar();

      }

    }
  );


/* =========================================================
   SUGGESTION CARDS
========================================================= */

document
  .querySelectorAll('.sugg-card')
  .forEach(
    function(card){

      card.addEventListener(
        'click',
        function(){

          const text =
            card.dataset.text ||
            card.querySelector('.d')
              .textContent;

          ta.value =
            text;

          resizeTextarea();

          ta.focus();

        }
      );

    }
  );


/* =========================================================
   MENU BUTTON
========================================================= */

document
  .getElementById('menuBtn')
  .addEventListener(
    'click',
    toggleSidebar
  );


/* =========================================================
   INITIALIZE
========================================================= */

loadConversationHistory();

renderSavedConversation();

resizeTextarea();

ta.focus();

</script>
